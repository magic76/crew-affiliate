name: Private admin checks
on:
  push:
    branches: [chatgpt/private-admin]
  pull_request:
    paths: ['src/admin.mjs','functions/admin/**','scripts/admin-test.mjs','.github/workflows/admin-check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm run build && npm test
