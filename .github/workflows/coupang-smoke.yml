name: Coupang Partners API smoke
on:
  push:
    branches: [chatgpt/coupang-provider]
    paths: ['.github/workflows/coupang-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline checks
        run: node scripts/coupang-smoke.mjs --self-test
      - name: One read-only Partners API probe
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_PARTNERS_TEST_PATH: /v2/providers/affiliate_open_api/apis/openapi/v1/products/search
          COUPANG_PARTNERS_TEST_QUERY: keyword=USB-C&limit=1
        run: |
          if [ -z "$COUPANG_ACCESS_KEY" ] || [ -z "$COUPANG_SECRET_KEY" ]; then
            echo "::error::Missing repository secrets"
            exit 1
          fi
          node scripts/coupang-smoke.mjs
