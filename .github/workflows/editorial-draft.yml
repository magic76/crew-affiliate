name: Editorial draft checks
on:
  push:
    branches: [chatgpt/editorial-draft-engine]
  pull_request:
    paths: ['src/editorial-draft.mjs', 'scripts/editorial-draft*.mjs', '.github/workflows/editorial-draft.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node scripts/editorial-draft-test.mjs && node --check scripts/editorial-draft.mjs
