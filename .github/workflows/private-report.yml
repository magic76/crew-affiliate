name: Private reporting checks
on:
  push:
    branches: [chatgpt/private-report-core]
  pull_request:
    paths: ['src/private-report.mjs', 'scripts/private-report*.mjs', '.github/workflows/private-report.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node scripts/private-report-test.mjs && node --check scripts/private-report.mjs
