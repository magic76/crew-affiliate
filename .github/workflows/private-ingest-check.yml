name: Private ingestion checks
on:
  push:
    branches: [chatgpt/gsc-gemini-live]
  pull_request:
    paths: ['src/private-ingest.mjs','src/live-catalog.mjs','scripts/private-ingest-test.mjs','scripts/editorial-live.mjs','functions/api/private-*.js','.github/workflows/private-ingest-check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm run build && npm test && node --check scripts/editorial-live.mjs
