<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多裝置充電功率試算｜選購研究室</title><meta name="description" content="估算多台裝置同時充電的功率需求。"><meta name="robots" content="noindex,follow"><meta property="og:title" content="多裝置充電功率試算"><meta property="og:description" content="估算多台裝置同時充電的功率需求。"><link rel="stylesheet" href="../assets/site.css"></head><body><header><div class="nav"><a class="brand" href="../index.html"><b class="mark">C</b> 選購研究室 <small>by Crew</small></a><nav aria-label="主導覽"><a href="../index.html#guides">選購指南</a><a href="../tools/index.html">功率試算</a><a href="../about/index.html">關於</a></nav></div></header><main><article><a class="back" href="../index.html">← 首頁</a><span class="eyebrow">免費工具</span><h1>多裝置充電功率試算</h1><p class="lead">輸入各裝置官方建議充電功率，沒有該裝置填 0。預設值僅供示範。</p><form id="power"><div class="fields"><label>手機（W）<input type="number" min="0" max="500" step="1" value="25" required></label><label>平板（W）<input type="number" min="0" max="500" step="1" value="30" required></label><label>筆電（W）<input type="number" min="0" max="500" step="1" value="65" required></label><label>其他裝置（W）<input type="number" min="0" max="500" step="1" value="0" required></label></div><button class="primary" type="submit">計算需求</button><div class="check" aria-live="polite">需求功率總和<output id="total">120 W</output></div></form><p class="note">總和不是選購保證，仍須核對每孔同時輸出的功率、協議與線材能力。</p><a href="../guides/travel-multiport-charger/index.html">閱讀旅行多孔充電器指南 →</a></article><script src="../assets/power.js" defer></script></main><footer><div><strong>選購研究室</strong><p>先搞懂需求，再決定買什麼。</p></div><div><a href="../about/index.html">編輯原則與分潤揭露</a><p>© Crew Affiliate</p></div></footer></body></html>
